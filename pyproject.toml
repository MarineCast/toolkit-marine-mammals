[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-mammal-toolkit"
version = "0.1.0"
description = "Reusable marine-mammal data contracts and domain processing for MarineCast"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "toolkit-seascape>=0.1.0", "beautifulsoup4>=4.12", "click>=8.1",
  "geopandas>=1.0", "h3>=4", "joblib>=1.3", "matplotlib>=3.8",
  "numpy>=1.26", "openpyxl>=3.1", "pandas>=2.1", "plotly>=5.24",
  "polars>=1", "pyarrow>=14", "pydantic>=2", "PyYAML>=6",
  "requests>=2.31", "scipy>=1.11", "scikit-learn>=1.4", "shapely>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
research = ["jupyter>=1", "nbformat>=5", "folium>=0.20"]

[project.scripts]
marine-mammals = "marine_mammal_toolkit.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marine_mammal_toolkit = ["py.typed", "resources/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
