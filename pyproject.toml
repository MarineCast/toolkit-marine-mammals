[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-mammal-toolkit"
version = "0.1.0"
description = "Reusable marine-mammal data contracts and domain processing for MarineCast"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "beautifulsoup4>=4.12", "click>=8.1", "h3>=4", "numpy>=1.26",
  "openpyxl>=3.1", "pandas>=2.1", "polars>=1", "pyarrow>=14",
  "pydantic>=2", "PyYAML>=6", "requests>=2.31", "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]
report = ["plotly>=5.24"]
imputation = [
  "toolkit-seascape>=0.1.0", "geopandas>=1.0", "joblib>=1.3",
  "matplotlib>=3.8", "plotly>=5.24", "scipy>=1.11",
  "scikit-learn>=1.4", "shapely>=2",
]
research = ["jupyter>=1", "nbformat>=5", "folium>=0.20"]

[project.scripts]
marine-mammals = "marine_mammal_toolkit.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marine_mammal_toolkit = ["py.typed", "resources/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
